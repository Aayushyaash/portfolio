<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Aayush Yash | Portfolio</title>
    <meta name="description"
        content="Aayush Yash — Computer Science graduate. Portfolio showcasing projects in AI, Full-Stack Development, and Python." />
    <meta property="og:title" content="Aayush Yash | Portfolio" />
    <meta property="og:description"
        content="Computer Science graduate showcasing projects in AI, Full-Stack Development, and Python." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://aayushyaash.github.io/portfolio/images/profile-pic.jpeg" />
    <meta property="og:url" content="https://aayushyaash.github.io/portfolio/" />
    <link rel="canonical" href="https://aayushyaash.github.io/portfolio/" />
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%BB%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link href="./css/tailwind.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="./css/style.css" rel="stylesheet" />
    <script src="./js/vendor/purify.min.js"></script>
</head>

<body class="font-sans antialiased overflow-x-hidden flex flex-col md:flex-row min-h-screen">
    <!-- NAV_PARTIAL -->
    <main id="main-content" class="flex-1 md:ml-64 bg-bg min-h-screen">
        <section class="relative py-20 px-6 md:px-12 lg:px-20 border-b border-border overflow-hidden" id="about">
            <div
                class="absolute top-0 right-0 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 pointer-events-none">
            </div>
            <div
                class="absolute bottom-0 left-0 w-64 h-64 bg-yellow-400/5 rounded-full blur-3xl translate-y-1/2 -translate-x-1/2 pointer-events-none">
            </div>
            <div class="max-w-6xl mx-auto flex flex-col-reverse lg:flex-row items-center gap-12 lg:gap-20">
                <div class="w-full lg:w-3/5 space-y-6">
                    <div id="availability-badge"
                        class="inline-flex items-center space-x-2 px-3 py-1 rounded-full border text-xs font-mono font-bold tracking-wide">
                        <span class="relative flex h-2 w-2">
                            <span id="availability-ping"
                                class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75"></span>
                            <span id="availability-dot" class="relative inline-flex rounded-full h-2 w-2"></span>
                        </span>
                        <span id="availability-text"></span>
                    </div>

                    <!-- 2. The Headline-->
                    <h1 id="hero-title"
                        class="text-3xl md:text-4xl font-extrabold text-white leading-tight tracking-tight mb-6">
                    </h1>
                    <p class="text-base sm:text-lg text-gray-400 max-w-xl leading-relaxed hero-bio" id="hero-bio">
                    </p>
                    <div class="flex flex-wrap gap-4 pt-4 mb-8 justify-center md:justify-start">
                        <a class="px-8 py-3 bg-white text-black font-bold rounded hover:bg-gray-200 transition-colors shadow-glow"
                            href="#projects">
                            View Work
                        </a>
                        <a class="px-8 py-3 bg-transparent border border-gray-600 text-white font-medium rounded hover:border-accent hover:text-accent transition-colors"
                            href="#contact">
                            Contact Me
                        </a>
                    </div>
                    <div
                        class="pt-8 flex flex-col items-center gap-6 md:flex-row md:gap-8 text-sm font-mono text-gray-500">
                        <div class="flex items-center gap-2">
                            <span class="text-accent text-lg sm:text-sm md:text-xl stat-experience"
                                id="stat-experience"></span>
                            <!-- Years Learning -->
                        </div>

                    </div>
                </div>
                <div class="w-full lg:w-2/5 hidden md:flex justify-center">
                    <div class="relative w-64 h-64 md:w-80 md:h-80 tilt-effect z-10">
                        <div
                            class="absolute inset-0 bg-gradient-to-tr from-accent to-accentBlue rounded-2xl opacity-80 blur-sm transform translate-x-2 translate-y-2">
                        </div>
                        <img alt="Profile"
                            class="relative w-full h-full object-cover rounded-2xl border-2 border-white/20 shadow-2xl grayscale hover:grayscale-0 transition-all duration-500 hero-image"
                            id="hero-profile-img" src="" />
                    </div>
                </div>
            </div>
        </section>

        <section class="border-b border-border overflow-hidden" id="timeline" style="display: none;">
            <div class="flex flex-col lg:flex-row lg:min-h-[500px]">
                <!-- Left Panel: Timeline Menu -->
                <div
                    class="lg:w-1/3 w-full border-b lg:border-b-0 lg:border-r border-border bg-surface/50 overflow-y-auto">
                    <div class="p-6 md:p-8">
                        <h3
                            class="text-sm font-mono font-bold text-muted uppercase tracking-widest mb-6 flex items-center gap-2">
                            <span class="material-symbols-outlined text-base">timeline</span> Timeline
                        </h3>
                        <div class="space-y-2" id="timeline-menu">
                            <!-- Milestone menu items rendered by JS -->
                        </div>
                    </div>
                </div>
                <!-- Right Panel: Content Detail -->
                <div class="lg:w-2/3 w-full bg-bg p-6 md:p-10 lg:p-12 overflow-y-auto lg:min-h-[500px]"
                    id="timeline-content">
                    <!-- Content panes rendered by JS -->
                </div>
            </div>
        </section>

        <section class="py-20 px-6 md:px-12 lg:px-20 border-b border-border bg-bg/50" id="projects">
            <div class="max-w-6xl mx-auto">
                <div class="flex items-center justify-between mb-16">
                    <h2 class="text-3xl font-bold text-white flex items-center gap-3">
                        <span class="w-2 h-8 bg-purple-500 rounded-sm"></span>
                        Featured Projects
                    </h2>
                    <span class="hidden md:block h-px flex-1 bg-border ml-8"></span>
                    <a class="text-sm font-mono text-accent hover:text-white transition-colors flex items-center gap-2 project-view-github"
                        href="#">View Github <i class="fas fa-arrow-right"></i></a>
                </div>

                <!-- Dynamic Project Container -->
                <div id="projects-container" class="space-y-16">
                    <!-- Projects will be injected here by main.js -->
                </div>

                <!-- Non-Featured Projects -->
                <div id="other-projects-section" class="mt-16" style="display: none;">
                    <h3 class="text-xl font-bold text-white mb-8 flex items-center gap-3">
                        <span class="w-2 h-6 bg-accentBlue rounded-sm"></span>
                        Other Noteworthy Projects
                    </h3>
                    <div id="other-projects-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    </div>
                </div>
            </div>
        </section>

        <section class="py-20 px-6 md:px-12 lg:px-20 border-b border-border" id="skills">
            <div class="max-w-6xl mx-auto">
                <div class="flex items-end justify-between mb-16">
                    <div>
                        <span
                            class="text-accentBlue font-mono text-xs font-bold tracking-[0.2em] block mb-2 uppercase">Stack</span>
                        <h2 class="text-4xl font-black text-white">Tech Stack</h2>
                    </div>
                    <div class="hidden md:block h-px flex-1 bg-border mx-12 mb-4"></div>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <div class="group relative bg-surface border border-border p-6 rounded-xl skill-tilt">
                        <div class="flex justify-between items-start mb-6">
                            <div class="text-3xl text-accent"><i class="fab fa-react"></i></div>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-2">Frontend</h3>
                        <p class="text-xs text-muted leading-tight" id="skill-frontend"></p>
                    </div>
                    <div class="group relative bg-surface border border-border p-6 rounded-xl skill-tilt">
                        <div class="flex justify-between items-start mb-6">
                            <div class="text-3xl text-accent"><i class="fab fa-python"></i></div>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-2">Backend</h3>
                        <p class="text-xs text-muted leading-tight" id="skill-backend"></p>
                    </div>
                    <div class="group relative bg-surface border border-border p-6 rounded-xl skill-tilt">
                        <div class="flex justify-between items-start mb-6">
                            <div class="text-3xl text-accent"><i class="fas fa-database"></i></div>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-2">Database</h3>
                        <p class="text-xs text-muted leading-tight" id="skill-database"></p>
                    </div>
                    <div class="group relative bg-surface border border-border p-6 rounded-xl skill-tilt">
                        <div class="flex justify-between items-start mb-6">
                            <div class="text-3xl text-accent"><i class="fab fa-docker"></i></div>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-2">DevOps</h3>
                        <p class="text-xs text-muted leading-tight" id="skill-devops"></p>
                    </div>
                </div>
            </div>
        </section>

        <section class="py-12 px-6 border-t border-border bg-surface" id="contact">
            <div class="max-w-4xl mx-auto text-center">
                <h2 class="text-3xl font-bold text-white mb-6">Get In Touch</h2>
                <p class="text-gray-400 mb-8 max-w-lg mx-auto">Have a project in mind or just want to chat? Drop a
                    message.</p>
                <a class="inline-flex items-center gap-2 px-6 py-3 bg-accent text-black font-bold rounded hover:bg-yellow-300 transition-colors contact-email"
                    href="mailto:#" id="contact-email-btn">
                    <span class="material-symbols-outlined">mail</span>
                    Say Hello
                </a>

            </div>
        </section>
        <!-- FOOTER_PARTIAL -->
    </main>
    <!-- Templates -->
    <template id="hero-title-template">
        <span class="hero-title-main"></span> <br class="hidden md:block" />
        <span
            class="text-transparent bg-clip-text bg-gradient-to-r from-accent to-yellow-200 hero-title-highlight"></span>
    </template>

    <template id="project-card-template">
        <div
            class="group grid grid-cols-1 lg:grid-cols-12 gap-8 items-center border border-border bg-surface p-1 rounded-2xl hover:border-yellow-400/50 transition-all duration-300">
            <!-- Image Section with Browser Window Effect -->
            <div class="lg:col-span-7 project-image-col">
                <div class="project-window-container">
                    <!-- Yellow glow overlay -->
                    <div class="absolute inset-0 bg-gradient-to-br to-transparent pointer-events-none project-gradient">
                    </div>
                    <!-- Browser Window -->
                    <div class="project-browser-window">
                        <div class="flex items-center gap-2 mb-4 shrink-0">
                            <div class="w-3 h-3 rounded-full bg-red-500"></div>
                            <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                            <div class="w-3 h-3 rounded-full bg-green-500"></div>
                        </div>
                        <div class="project-content-wrapper relative">
                            <img src="" alt="" loading="lazy"
                                class="w-full flex-1 object-cover rounded-lg opacity-80 group-hover:opacity-100 transition-opacity duration-500 project-image"
                                onerror="this.onerror=null;this.style.display='none';this.nextElementSibling.classList.remove('hidden');" />
                            <!-- Skeleton (matches render logic: hidden by default if image exists) -->
                            <div class="hidden project-skeleton">
                                <div class="grid grid-cols-3 gap-4 flex-1">
                                    <div class="col-span-2 space-y-3">
                                        <div class="h-4 bg-border/50 rounded w-3/4"></div>
                                        <div class="h-20 bg-border/30 rounded w-full"></div>
                                        <div class="h-12 bg-border/20 rounded w-5/6"></div>
                                    </div>
                                    <div class="bg-accentBlue/20 rounded-lg"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Text Section -->
            <div class="lg:col-span-5 p-6 lg:p-8 project-text-col">
                <div class="text-accentBlue font-mono text-sm mb-2 project-number"></div>
                <h3 class="text-2xl font-bold text-white mb-4 group-hover:text-accent transition-colors project-title">
                </h3>
                <p class="text-gray-400 mb-6 leading-relaxed project-description"></p>
                <div class="flex flex-wrap gap-2 mb-8 font-mono text-xs text-gray-300 project-tags"></div>
                <div class="flex items-center gap-4 project-links"></div>
            </div>
        </div>
    </template>

    <template id="compact-project-card-template">
        <div
            class="bg-surface border border-border p-6 rounded-xl hover:border-yellow-400/50 transition-all group flex flex-col">
            <div class="flex justify-between items-start mb-3">
                <span class="material-symbols-outlined text-muted text-2xl">folder_open</span>
                <div class="flex gap-3 project-links"></div>
            </div>
            <h4 class="text-lg font-bold text-white mb-2 group-hover:text-accent transition-colors project-title"></h4>
            <p class="text-sm text-muted mb-4 line-clamp-3 flex-1 project-description"></p>
            <div class="flex flex-wrap gap-2 mt-auto project-tags"></div>
        </div>
    </template>

    <template id="timeline-menu-item-template">
        <div class="timeline-menu-group">
            <div class="milestone-item p-4 cursor-pointer hover:bg-surfaceHighlight transition-colors rounded-r-lg border-l-4 border-transparent group"
                tabindex="0" role="button">
                <div class="flex justify-between items-start mb-1">
                    <h4 class="font-bold text-muted group-hover:text-accent transition-colors milestone-title"></h4>
                    <span
                        class="text-[10px] font-mono text-muted bg-bg px-1.5 py-0.5 rounded whitespace-nowrap flex-shrink-0 milestone-date"></span>
                </div>
                <p class="text-sm text-muted group-hover:text-accentBlue font-medium milestone-org"></p>
                <p class="text-xs text-muted mt-2 line-clamp-2 milestone-summary"></p>
            </div>
            <div class="inline-content-pane bg-bg px-6 hidden"></div>
        </div>
    </template>

    <template id="timeline-pane-template">
        <div class="content-pane hidden"></div>
    </template>

    <template id="timeline-inner-content-template">
        <div class="timeline-inner-content">
            <div class="flex items-center gap-3 mb-6">
                <span class="milestone-type px-3 py-1 text-xs font-bold rounded-full border"></span>
                <span class="h-px w-12 bg-border"></span>
                <span class="milestone-date-range text-xs font-mono text-muted"></span>
            </div>
            <h2 class="milestone-full-title text-3xl font-bold text-white mb-2"></h2>
            <div class="milestone-org-row text-accentBlue flex items-center gap-1 mb-8">
                <span class="material-symbols-outlined text-lg milestone-org-icon"></span>
                <span class="milestone-org-name"></span>
            </div>
            <div class="prose prose-invert max-w-none mb-10">
                <p class="milestone-description text-gray-300 leading-relaxed"></p>
            </div>
            <div class="milestone-boxes grid grid-cols-1 md:grid-cols-2 gap-6 mb-10"></div>
            <div class="milestone-links border-t border-border pt-8 hidden">
                <h4 class="text-xs font-mono font-bold text-muted uppercase tracking-widest mb-4">Related Project Links
                </h4>
                <div class="links-container flex gap-4"></div>
            </div>
        </div>
    </template>

    <template id="timeline-box-template">
        <div class="bg-surface border border-border p-5 rounded-xl h-full">
            <h4 class="box-title text-sm font-bold text-white mb-3 flex items-center gap-2">
                <span class="material-symbols-outlined box-icon text-lg"></span>
                <span class="box-title-text"></span>
            </h4>
            <div class="box-content"></div>
        </div>
    </template>

    <script type="module" src="./js/main.js"></script>
</body>

</html>
